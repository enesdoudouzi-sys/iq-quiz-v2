apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iq-quiz.fullname" . }}
  labels:
    {{- include "iq-quiz.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "iq-quiz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iq-quiz.selectorLabels" . | nindent 8 }}
      annotations:
        # Pods neu starten, wenn sich die Zugangsdaten ändern
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.metrics.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: METRICS_OFFEN    # /metrics ist im Cluster nur intern erreichbar
              value: "true"
          envFrom:
            - secretRef:
                name: {{ include "iq-quiz.secretName" . }}
          readinessProbe:            # erst Verkehr schicken, wenn der Server antwortet
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:             # hängenden Container neu starten
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
