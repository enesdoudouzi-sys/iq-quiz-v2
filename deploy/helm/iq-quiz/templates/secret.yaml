{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iq-quiz.fullname" . }}
  labels:
    {{- include "iq-quiz.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.databaseUrl oder existingSecret setzen" .Values.secret.databaseUrl | quote }}
  ADMIN_TOKEN: {{ required "secret.adminToken oder existingSecret setzen" .Values.secret.adminToken | quote }}
{{- end }}
