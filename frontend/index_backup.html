<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ · Test</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="sv" class="start-screen">
  <div style="font-size:56px">🧠</div>
  <h1>IQ · Test</h1>
  <p>15 Fragen · 3 Phasen · Timer pro Frage</p>
  <input class="start-input" id="ni" type="text" placeholder="Dein Name..." maxlength="20"/>
  <button class="start-btn" id="start-btn" onclick="startGame()">Jetzt starten →</button>
  <button class="hs-btn" onclick="showHS()">🏆 Highscores</button>
</div>

<div id="qv" class="quiz-wrap">
  <div class="ql">
    <div class="timer-ring" id="trw">
      <svg width="110" height="110" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="46" fill="none" stroke="#1a2540" stroke-width="7"/>
        <circle id="ta" cx="55" cy="55" r="46" fill="none" stroke="#4a90e2" stroke-width="7"
          stroke-dasharray="289.03" stroke-dashoffset="0" stroke-linecap="round"
          transform="rotate(-90 55 55)" style="transition:stroke-dashoffset 1s linear,stroke .4s;"/>
      </svg>
      <span class="t-num" id="tn">20</span>
    </div>
    <div class="t-lbl">Sekunden</div>
    <div class="iq-live">
      <div class="iq-live-lbl">Aktueller IQ</div>
      <div class="iq-live-num" id="iq-live">85</div>
      <div class="iq-live-txt" id="iq-live-txt">Unterdurchschnittlich</div>
    </div>
    <div class="phase-row">
      <div class="phase-dot" id="pdot"></div>
      <span class="phase-lbl" id="pb">Phase</span>
    </div>
  </div>

  <div class="qm">
    <div class="qm-top">
      <span class="qm-logo">IQ · TEST</span>
      <span class="qm-ctr" id="qc">1 / 15</span>
    </div>
    <div class="prog"><div class="prog-fill" id="pf" style="width:0%"></div></div>
    <div class="preis" id="preis">100 €</div>
    <div id="sb" class="seq" style="display:none;"></div>
    <div class="fbox"><div class="qtext" id="qt">Lade...</div></div>
    <div class="opts" id="op"></div>
    <div class="fb" id="fb"></div>
    <div class="iq-fb" id="iq-fb">
      <div class="iq-fb-lbl">Dein IQ nach dieser Frage</div>
      <div class="iq-fb-num" id="iq-fb-num">—</div>
      <div class="iq-fb-bez" id="iq-fb-bez">—</div>
    </div>
    <div style="overflow:hidden;margin-top:.8rem;">
      <button class="nxt" id="nb">Nächste Frage →</button>
    </div>
  </div>

  <div class="qr">
    <div class="leiter-lbl">IQ · Leiter</div>
    <div id="leiter"></div>
  </div>
</div>

<div id="rv" class="result-page">
  <div class="rv-hero">
    <div class="rv-emoji" id="rv-emoji">🧠</div>
    <div class="rv-lbl">Dein Ergebnis</div>
    <div class="rv-iq" id="rv-iq"></div>
    <div class="rv-sub" id="rv-sub"></div>
    <span class="rv-chip" id="rv-chip"></span>
  </div>
  <div class="rv-grid">
    <div class="rv-card"><div class="rv-ct">Allgemeinwissen</div><div class="rv-cv" id="baw"></div></div>
    <div class="rv-card"><div class="rv-ct">Logik</div><div class="rv-cv" id="blog"></div></div>
    <div class="rv-card"><div class="rv-ct">Konzentration</div><div class="rv-cv" id="bkz"></div></div>
    <div class="rv-card"><div class="rv-ct">Ø Reaktion</div><div class="rv-cv" id="bt"></div></div>
  </div>
  <div class="divider"></div>
  <div class="err-lbl" id="err-lbl"></div>
  <div id="ml"></div>
  <div class="save-row">
    <input class="save-in" id="sn" placeholder="Name für Highscore..."/>
    <button class="save-btn" onclick="saveHS()">💾 Speichern</button>
  </div>
  <button class="rbtn" onclick="showStart()">↺ Nochmal starten</button>
</div>

<div id="hv" class="hs-page">
  <h2>🏆 Highscores</h2>
  <div id="hl"></div>
  <button class="rbtn" onclick="showStart()">← Zurück</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
