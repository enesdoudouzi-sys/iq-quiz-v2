<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ-Test</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="sv" class="start-screen">
  <div style="font-size:56px">🧠</div>
  <h1>IQ · Test</h1>
  <p>15 Fragen · 3 Phasen · Timer pro Frage<br>Finde heraus wie hoch dein IQ wirklich ist.</p>
  <input class="start-input" id="ni" type="text" placeholder="Dein Name..." maxlength="20"/>
  <button class="start-btn" onclick="startGame()">Test starten →</button>
  <button class="hs-btn" onclick="showHS()">🏆 Highscores anzeigen</button>
</div>

<div id="qv" style="width:100%;display:none;flex-direction:column;align-items:center;">
  <div class="header">
    <span class="logo">IQ · Test</span>
    <span class="qctr" id="qc">1 / 15</span>
  </div>
  <div class="prog-wrap">
    <div class="prog-track">
      <div class="prog-fill" id="pf" style="width:0%"></div>
    </div>
  </div>
  <div class="stage">
    <div class="phase-row">
      <div class="phase-dot" id="pdot"></div>
      <span class="phase-txt" id="pb">Phase</span>
    </div>
    <div class="timer-stage">
      <div class="timer-ring-wrap" id="trw">
        <svg width="140" height="140" viewBox="0 0 140 140" style="position:absolute;top:0;left:0;">
          <circle cx="70" cy="70" r="60" fill="none" stroke="#1e2a3a" stroke-width="8"/>
          <circle id="ta" cx="70" cy="70" r="60" fill="none" stroke="#4a90e2" stroke-width="8"
            stroke-dasharray="376.99" stroke-dashoffset="0" stroke-linecap="round"
            transform="rotate(-90 70 70)"
            style="transition:stroke-dashoffset 1s linear,stroke 0.4s;"/>
        </svg>
        <span class="timer-num" id="tn">20</span>
      </div>
      <span class="timer-sub">Sekunden</span>
    </div>
    <div id="sb" class="seq-box" style="display:none;"></div>
    <div class="qtext" id="qt"></div>
    <div class="opts" id="op"></div>
    <div class="fb" id="fb"></div>
    <div style="display:flex;justify-content:flex-end;width:100%;">
      <button class="nxt" id="nb">Nächste Frage →</button>
    </div>
  </div>
</div>

<div id="rv" class="result-page" style="display:none;">
  <div class="res-hero">
    <div class="res-title">Dein Ergebnis</div>
    <div class="iq-big" id="ri"></div>
    <div class="iq-sub" id="rd"></div>
    <div class="sc-row"><span class="sc-chip" id="rs"></span></div>
  </div>
  <div class="bdown">
    <div class="bd"><div class="bd-t">Allgemeinwissen</div><div class="bd-v" id="baw"></div></div>
    <div class="bd"><div class="bd-t">Logik</div><div class="bd-v" id="blog"></div></div>
    <div class="bd"><div class="bd-t">Konzentration</div><div class="bd-v" id="bkz"></div></div>
    <div class="bd"><div class="bd-t">Ø Reaktion</div><div class="bd-v" id="bt"></div></div>
  </div>
  <div class="divider"></div>
  <div class="mt" id="mtit"></div>
  <div id="ml"></div>
  <div class="save-row">
    <input class="save-input" id="sn" placeholder="Name für Highscore..."/>
    <button class="save-btn" onclick="saveHS()">💾 Speichern</button>
  </div>
  <button class="rbtn" onclick="showStart()">↺ &nbsp;Nochmal starten</button>
</div>

<div id="hv" class="hs-page" style="display:none;">
  <h2>🏆 Highscores</h2>
  <div id="hl"></div>
  <button class="rbtn" onclick="showStart()">← Zurück</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
